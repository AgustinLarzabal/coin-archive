name: Promote verified staging commit to production

on:
  workflow_run:
    workflows: [Deploy staging]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_AUTH_GOOGLE_ENABLED: ${{ vars.VITE_AUTH_GOOGLE_ENABLED }}
      VITE_SHOW_SIGN_IN_BUTTON: ${{ vars.VITE_SHOW_SIGN_IN_BUTTON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter api run deploy:production
      - name: Synchronize API Worker secrets
        run: |
          umask 077
          printf '%s' "$DATABASE_URL" > "$RUNNER_TEMP/database-url"
          printf '%s' "$BETTER_AUTH_SECRET" > "$RUNNER_TEMP/better-auth-secret"
          printf '%s' "$GOOGLE_CLIENT_ID" > "$RUNNER_TEMP/google-client-id"
          printf '%s' "$GOOGLE_CLIENT_SECRET" > "$RUNNER_TEMP/google-client-secret"
          pnpm --filter api exec wrangler secret put DATABASE_URL --env production < "$RUNNER_TEMP/database-url"
          pnpm --filter api exec wrangler secret put BETTER_AUTH_SECRET --env production < "$RUNNER_TEMP/better-auth-secret"
          pnpm --filter api exec wrangler secret put GOOGLE_CLIENT_ID --env production < "$RUNNER_TEMP/google-client-id"
          pnpm --filter api exec wrangler secret put GOOGLE_CLIENT_SECRET --env production < "$RUNNER_TEMP/google-client-secret"
      - run: pnpm --filter web run deploy:production
