name: Bootstrap initial Admin

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose first Google-authenticated Collector to promote
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap initial Admin
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run bootstrap:initial-admin
