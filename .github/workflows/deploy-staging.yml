name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify main commit
    runs-on: ubuntu-latest
    env:
      DATABASE_TEST_URL: postgresql://coin_archive:coin_archive@localhost:5432/coin_archive_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:start
      - run: pnpm db:test

  deploy:
    name: Migrate and deploy staging
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_AUTH_GOOGLE_ENABLED: ${{ vars.VITE_AUTH_GOOGLE_ENABLED }}
      VITE_SHOW_SIGN_IN_BUTTON: ${{ vars.VITE_SHOW_SIGN_IN_BUTTON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter api run deploy:staging
      - name: Synchronize API Worker secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          umask 077
          printf '%s' "$DATABASE_URL" > "$RUNNER_TEMP/database-url"
          printf '%s' "$BETTER_AUTH_SECRET" > "$RUNNER_TEMP/better-auth-secret"
          printf '%s' "$GOOGLE_CLIENT_ID" > "$RUNNER_TEMP/google-client-id"
          printf '%s' "$GOOGLE_CLIENT_SECRET" > "$RUNNER_TEMP/google-client-secret"
          pnpm --filter api exec wrangler secret put DATABASE_URL --env staging < "$RUNNER_TEMP/database-url"
          pnpm --filter api exec wrangler secret put BETTER_AUTH_SECRET --env staging < "$RUNNER_TEMP/better-auth-secret"
          pnpm --filter api exec wrangler secret put GOOGLE_CLIENT_ID --env staging < "$RUNNER_TEMP/google-client-id"
          pnpm --filter api exec wrangler secret put GOOGLE_CLIENT_SECRET --env staging < "$RUNNER_TEMP/google-client-secret"
      - run: pnpm --filter web run deploy:staging
