name: Staging release
run-name: Staging release ${{ github.sha }}

on:
  push:
    branches: [main]

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser for deployed Archive check
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build, test, migrate, deploy, and verify staging
        run: pnpm --filter @coin-archive/db staging:release
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          STAGING_WEB_ORIGIN: ${{ vars.STAGING_WEB_ORIGIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Record verified commit
        run: echo "Staging release verified for commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
