services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: coin_archive
      POSTGRES_USER: coin_archive
      POSTGRES_PASSWORD: coin_archive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coin_archive -d coin_archive"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
